services:
  # -------------------------------------------------------------
  # DATABASE TIER: MySQL 8 with ACID Persistence & Auto-Init Schema
  # -------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: portfolio-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Singh5322f}
      MYSQL_DATABASE: ${DB_NAME:-portfolio_db}
      MYSQL_USER: ${DB_USER:-portfolio_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-Singh5322f}
    volumes:
      - portfolio_mysql_data:/var/lib/mysql
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-Singh5322f}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - portfolio-network

  # -------------------------------------------------------------
  # BACKEND TIER: Node.js 20 Express REST API with Health Probes
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-portfolio_db}
      - DB_USER=${DB_USER:-portfolio_user}
      - DB_PASSWORD=${DB_PASSWORD:-Singh5322f}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173,http://localhost:80,http://localhost}
      - RECIPIENT_EMAIL=${RECIPIENT_EMAIL:-23amtics402@gmail.com}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - portfolio-network

  # -------------------------------------------------------------
  # FRONTEND TIER: React 19 + Vite Production Bundle via NGINX
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - portfolio-network

# ---------------------------------------------------------------
# PERSISTENT STORAGE VOLUMES
# ---------------------------------------------------------------
volumes:
  portfolio_mysql_data:
    name: portfolio_mysql_data
    driver: local

# ---------------------------------------------------------------
# ISOLATED DOCKER BRIDGE NETWORK
# ---------------------------------------------------------------
networks:
  portfolio-network:
    name: portfolio-network
    driver: bridge

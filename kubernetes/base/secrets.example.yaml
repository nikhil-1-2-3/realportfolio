apiVersion: v1
kind: Secret
metadata:
  name: portfolio-secrets
  namespace: portfolio
  labels:
    app.kubernetes.io/name: portfolio
    app.kubernetes.io/part-of: portfolio-devops
type: Opaque
stringData:
  DB_HOST: "portfolio-rds-mysql.xxxxxxxx.ap-south-1.rds.amazonaws.com"
  DB_USER: "portfolio_admin"
  DB_PASSWORD: "ReplaceWithActualRdsPassword"
  SMTP_USER: "your-email@gmail.com"
  SMTP_PASS: "your-app-specific-password"


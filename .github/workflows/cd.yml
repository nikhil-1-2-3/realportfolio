name: Continuous Deployment (Backend to AWS EC2)

on:
  workflow_run:
    workflows: ["Continuous Integration & Vulnerability Scan"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Explicit image tag or Git SHA to deploy (default: latest)"
        required: true
        default: "latest"

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Backend to AWS EC2
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Deployment Image Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Container via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            TAG="${{ steps.vars.outputs.TAG }}"
            IMAGE="ghcr.io/${{ github.repository_owner }}/portfolio-backend:${TAG}"
            echo "=== Pulling ${IMAGE} ==="
            sudo docker pull "${IMAGE}" || sudo docker pull "ghcr.io/${{ github.repository_owner }}/portfolio-backend:latest"
            
            echo "=== Stopping current container ==="
            sudo docker stop portfolio-api 2>/dev/null || true
            sudo docker rm portfolio-api 2>/dev/null || true
            
            echo "=== Launching new backend container ==="
            sudo docker run -d \
              --name portfolio-api \
              --restart unless-stopped \
              -p 5000:5000 \
              -e NODE_ENV=production \
              -e PORT=5000 \
              -e DB_HOST=portfolio-rds-mysql.cxa24sgui43m.ap-south-1.rds.amazonaws.com \
              -e DB_PORT=3306 \
              -e DB_USER=portfolio_admin \
              -e DB_PASSWORD="PortfolioSecure2026!#" \
              -e DB_NAME=portfolio_db \
              -e CORS_ORIGIN="*" \
              "${IMAGE}"
              
            echo "=== Verifying health check on http://localhost:5000/api/health ==="
            for i in {1..20}; do
              if curl -sf http://localhost:5000/api/health > /dev/null; then
                echo "=== Deployment Succeeded! Backend is healthy and connected to RDS MySQL. ==="
                sudo docker ps --filter "name=portfolio-api"
                exit 0
              fi
              echo "Waiting for backend readiness ($i/20)..."
              sleep 2
            done
            
            echo "=== Deployment Failed: Health check did not return 200 OK ==="
            sudo docker logs --tail 50 portfolio-api
            exit 1
